
name: Electricity Bill Calculator Maven Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Maven Project
        run: mvn clean compile

      - name: Run JUnit Tests
        run: mvn test

      - name: Package Maven Project
        run: mvn package
